name: DeadZone Database Integrity Contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout DeadZone database
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test DeadZone schema and protect keybox contents
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_database_contract.py -v
          python3 scripts/validate_deadzone_database.py --root .
